<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Sunset City — a top-down open-world driving and action game at golden hour, generated entirely in code.">
  <title>Sunset City</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    /* Visually hidden, never shown: the aria-live status line screen readers announce. */
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Sunset City: an open-world driving and action game at golden hour"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
