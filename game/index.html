<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset City</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #14131a;
    overflow: hidden;
    font-family: sans-serif;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }
  #aria {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunset City, top-down open world crime game"></canvas>
<p id="aria" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
